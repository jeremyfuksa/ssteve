[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
markers =
    integration: end-to-end tests that exercise the full pipeline
    slow: takes seconds, not milliseconds -- real-time feeds, decode budgets,
        and whole-transmission decodes. Split into its own CI job so the rest
        of the suite can report in about three minutes. Profiled 2026-08-19:
        these are half the wall clock of a full run.
