name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [16, 18, 20]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Install dependencies (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        # Xcode command line tools should be pre-installed
        xcode-select --print-path

    - name: Install dependencies (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        # Visual Studio Build Tools should be available in GitHub Actions
        echo "Using pre-installed Visual Studio Build Tools"

    - name: Install npm dependencies
      run: npm ci

    - name: Build native addon
      run: npm run build

    - name: Run tests
      run: npm test

    - name: Test example usage
      run: |
        node examples/basic_decode.js --help || true

    - name: Upload build artifacts
      if: matrix.node-version == '18'  # Only upload for one Node version per OS
      uses: actions/upload-artifact@v4
      with:
        name: addon-${{ matrix.platform }}-node${{ matrix.node-version }}
        path: |
          build/Release/
          !build/Release/obj.target/
        retention-days: 7

  test-audio-files:
    name: Test with Audio Files
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Install npm dependencies
      run: npm ci

    - name: Build native addon
      run: npm run build

    - name: Test with provided audio samples
      run: |
        # Test if audio files exist and run basic tests
        find codec-testing -name "*.wav" -type f | head -3 | while read file; do
          echo "Testing with: $file"
          node examples/basic_decode.js "$file" "test_output_$(basename "$file" .wav).rgb" || echo "Test failed for $file"
        done

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          test_output_*.rgb
          test_output_*.txt
        retention-days: 3
        if-no-files-found: warn

  lint-and-format:
    name: Lint and Format Check
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js 18
      uses: actions/setup-node@v4
      with:
        node-version: 18
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Check C++ code formatting
      run: |
        # Basic C++ style checks
        echo "Checking C++ code style..."
        find src -name "*.cpp" -o -name "*.h" | xargs grep -l "	" && echo "Found tabs in C++ files" || echo "No tabs found"
        
    - name: Check JavaScript code formatting  
      run: |
        # Basic JS style checks
        echo "Checking JavaScript code style..."
        find lib examples test -name "*.js" | xargs grep -l "	" && echo "Found tabs in JS files" || echo "No tabs found"