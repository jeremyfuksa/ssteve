name: CI

# Runs on pull requests only (2026-08-05). The push-to-main trigger was dropped to halve
# Actions minutes on this private repo: merging a green PR re-ran the identical suite for
# no new information.
#
# Caveat: branch protection is unavailable on this plan, so a direct push to main bypasses
# CI entirely. Work must arrive via PR for this to gate anything.
# `workflow_dispatch` allows a manual run from the Actions tab.
on:
  pull_request:
  workflow_dispatch:

# A new push supersedes the run already in flight for the same branch. Without this a
# rebase-then-merge leaves the old run burning a runner for another twenty minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types, and everything that is not marked slow. This is the signal you wait
  # for: it reports in a few minutes rather than the twenty the single job took.
  fast:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes. This job measured 7m36s at its slowest,
    # so anything past 20 is wedged, not slow.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sstv_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sounddevice needs PortAudio, opencv-python needs libGL.
      #
      # On 2026-08-19 this step hung 17 minutes on
      # `archive.ubuntu.com noble-security InRelease`. Successful runs fetch
      # that repo from `azure.archive.ubuntu.com` in about a second, so the
      # hang is apt falling back to the global archive when the Azure mirror
      # stops answering -- and the global one is routinely overloaded.
      #
      # apt waits forever by default, so the fix is a timeout on every network
      # operation plus retries, and skipping apt altogether when the runner
      # image already carries both libraries.
      - name: Install system dependencies (PortAudio, OpenGL for OpenCV)
        timeout-minutes: 4
        run: |
          # Both packages already exist in the runner image often enough to try
          # first: if they are present, skip apt entirely.
          if dpkg -s libportaudio2 libgl1 >/dev/null 2>&1; then
            echo "libportaudio2 and libgl1 already installed; skipping apt"
            exit 0
          fi
          # Bound every apt network operation. The default is an unbounded wait,
          # which is how one stalled mirror held the job for 17 minutes.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for attempt in 1 2 3; do
            if sudo apt-get update $APT_OPTS \
               && sudo apt-get install -y --no-install-recommends $APT_OPTS libportaudio2 libgl1; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 5
          done
          echo "apt failed three times -- treating as infrastructure, not a code failure" >&2
          exit 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/

      - name: Type check
        run: uv run mypy src/

      # -n auto uses the runner's four cores. Measured locally on the full suite:
      # 10m42s serial, 4m49s at -n 4, with every timing-sensitive test passing.
      - name: Run fast tests
        run: uv run pytest -q -m "not slow" -n auto

  # Real-time feeds, decode budgets, whole-transmission decodes, and the demodulator
  # throughput budget. Slow on purpose: a Scottie S2 is 71 seconds of audio, so
  # decoding one at wall-clock rate takes 71 seconds. Nothing to optimise; they just
  # should not block the fast signal.
  #
  # Runs SERIALLY. TestThroughput asserts the demodulator beats real time, which is a
  # CPU measurement -- under -n auto on a four-core runner it failed at 0.109s against
  # a 0.100s budget purely from contention. Sharing cores makes a throughput assertion
  # meaningless, so this job does not.
  slow:
    runs-on: ubuntu-latest
    # Serial by design and measured at 6m03s; 20 minutes is a wedge, not work.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sstv_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sounddevice needs PortAudio, opencv-python needs libGL.
      #
      # On 2026-08-19 this step hung 17 minutes on
      # `archive.ubuntu.com noble-security InRelease`. Successful runs fetch
      # that repo from `azure.archive.ubuntu.com` in about a second, so the
      # hang is apt falling back to the global archive when the Azure mirror
      # stops answering -- and the global one is routinely overloaded.
      #
      # apt waits forever by default, so the fix is a timeout on every network
      # operation plus retries, and skipping apt altogether when the runner
      # image already carries both libraries.
      - name: Install system dependencies (PortAudio, OpenGL for OpenCV)
        timeout-minutes: 4
        run: |
          # Both packages already exist in the runner image often enough to try
          # first: if they are present, skip apt entirely.
          if dpkg -s libportaudio2 libgl1 >/dev/null 2>&1; then
            echo "libportaudio2 and libgl1 already installed; skipping apt"
            exit 0
          fi
          # Bound every apt network operation. The default is an unbounded wait,
          # which is how one stalled mirror held the job for 17 minutes.
          APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15"
          for attempt in 1 2 3; do
            if sudo apt-get update $APT_OPTS \
               && sudo apt-get install -y --no-install-recommends $APT_OPTS libportaudio2 libgl1; then
              exit 0
            fi
            echo "apt attempt $attempt failed; retrying"
            sleep 5
          done
          echo "apt failed three times -- treating as infrastructure, not a code failure" >&2
          exit 1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run slow tests
        run: uv run pytest -q -m slow
