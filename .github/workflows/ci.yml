name: CI

# Runs on pull requests only (2026-08-05). The push-to-main trigger was dropped to halve
# Actions minutes on this private repo: merging a green PR re-ran the identical suite for
# no new information.
#
# Caveat: branch protection is unavailable on this plan, so a direct push to main bypasses
# CI entirely. Work must arrive via PR for this to gate anything.
# `workflow_dispatch` allows a manual run from the Actions tab.
on:
  pull_request:
  workflow_dispatch:

# A new push supersedes the run already in flight for the same branch. Without this a
# rebase-then-merge leaves the old run burning a runner for another twenty minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types, and everything that is not marked slow. This is the signal you wait
  # for: it reports in a few minutes rather than the twenty the single job took.
  fast:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes. This job measured 7m36s at its slowest,
    # so anything past 20 is wedged, not slow.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sstv_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sounddevice needs PortAudio, opencv-python needs libGL.
      #
      # Best-effort, never fatal. `tests/conftest.py` mocks sounddevice before
      # any SSTeVe module is imported precisely so PortAudio is not needed in
      # CI, and opencv is used only for imwrite/cvtColor -- no GUI, so libGL is
      # not exercised either. The packages are installed when they are cheap to
      # get and skipped when the mirror is unwell.
      #
      # On 2026-08-19 the Azure mirror went down entirely (`Ign:` on all four
      # noble repos) and apt fell back to the global archive.ubuntu.com, which
      # hung for 17 minutes and then failed the run. A broken Ubuntu mirror
      # should not be able to fail this suite.
      - name: Install system dependencies (best effort)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if dpkg -s libportaudio2 libgl1 >/dev/null 2>&1; then
            echo "already present; skipping apt"
            exit 0
          fi
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10"
          sudo apt-get update $APT_OPTS \
            && sudo apt-get install -y --no-install-recommends $APT_OPTS libportaudio2 libgl1 \
            || echo "apt unavailable; continuing -- the suite does not require these"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/

      - name: Type check
        run: uv run mypy src/

      # -n auto uses the runner's four cores. Measured locally on the full suite:
      # 10m42s serial, 4m49s at -n 4, with every timing-sensitive test passing.
      - name: Run fast tests
        run: uv run pytest -q -m "not slow" -n auto

  # Real-time feeds, decode budgets, whole-transmission decodes, and the demodulator
  # throughput budget. Slow on purpose: a Scottie S2 is 71 seconds of audio, so
  # decoding one at wall-clock rate takes 71 seconds. Nothing to optimise; they just
  # should not block the fast signal.
  #
  # Runs SERIALLY. TestThroughput asserts the demodulator beats real time, which is a
  # CPU measurement -- under -n auto on a four-core runner it failed at 0.109s against
  # a 0.100s budget purely from contention. Sharing cores makes a throughput assertion
  # meaningless, so this job does not.
  slow:
    runs-on: ubuntu-latest
    # Serial by design and measured at 6m03s; 20 minutes is a wedge, not work.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sstv_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sounddevice needs PortAudio, opencv-python needs libGL.
      #
      # Best-effort, never fatal. `tests/conftest.py` mocks sounddevice before
      # any SSTeVe module is imported precisely so PortAudio is not needed in
      # CI, and opencv is used only for imwrite/cvtColor -- no GUI, so libGL is
      # not exercised either. The packages are installed when they are cheap to
      # get and skipped when the mirror is unwell.
      #
      # On 2026-08-19 the Azure mirror went down entirely (`Ign:` on all four
      # noble repos) and apt fell back to the global archive.ubuntu.com, which
      # hung for 17 minutes and then failed the run. A broken Ubuntu mirror
      # should not be able to fail this suite.
      - name: Install system dependencies (best effort)
        continue-on-error: true
        timeout-minutes: 3
        run: |
          if dpkg -s libportaudio2 libgl1 >/dev/null 2>&1; then
            echo "already present; skipping apt"
            exit 0
          fi
          APT_OPTS="-o Acquire::Retries=2 -o Acquire::http::Timeout=10 -o Acquire::https::Timeout=10"
          sudo apt-get update $APT_OPTS \
            && sudo apt-get install -y --no-install-recommends $APT_OPTS libportaudio2 libgl1 \
            || echo "apt unavailable; continuing -- the suite does not require these"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run slow tests
        run: uv run pytest -q -m slow
