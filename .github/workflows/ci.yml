name: CI

# Runs on pull requests only (2026-08-05). The push-to-main trigger was dropped to halve
# Actions minutes on this private repo: merging a green PR re-ran the identical suite for
# no new information.
#
# Branch protection on main requires both jobs below and has `strict` set, so a PR must
# also be up to date with main before it can merge. Renaming a job therefore breaks every
# merge until the required-checks list is updated to match -- which is exactly what
# happened on 2026-08-19 when this workflow's single `python-tests` job became `fast` and
# `slow`.
# `workflow_dispatch` allows a manual run from the Actions tab.
on:
  pull_request:
  workflow_dispatch:

# A new push supersedes the run already in flight for the same branch. Without this a
# rebase-then-merge leaves the old run burning a runner for another twenty minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, types, and everything that is not marked slow. This is the signal you wait
  # for: it reports in a few minutes rather than the twenty the single job took.
  fast:
    runs-on: ubuntu-latest
    # GitHub's default is 360 minutes. This job measured 7m36s at its slowest,
    # so anything past 20 is wedged, not slow.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: sstv_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sounddevice needs PortAudio, opencv-python needs libGL.
      #
      # Not installed at all, deliberately.
      #
      # tests/conftest.py mocks sounddevice before any SSTeVe module is
      # imported -- its own comment says "This prevents PortAudio library
      # errors in CI environments" -- and opencv is used only for imwrite and
      # cvtColor, so no GUI path and no libGL. Verified locally that the
      # package imports and cv2.imwrite work with sounddevice mocked out.
      #
      # Keeping the step cost 192 seconds on 2026-08-19 while the Azure mirror
      # was down (`Ign:` on all four noble repos, falling back to the global
      # archive), for packages nothing in the suite touches. If a future test
      # genuinely needs real audio hardware, add the install back to that job
      # alone rather than to every run.

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/

      - name: Type check
        run: uv run mypy src/

      # -n auto uses the runner's four cores. Measured locally on the full suite:
      # 10m42s serial, 4m49s at -n 4, with every timing-sensitive test passing.
      - name: Run fast tests
        run: uv run pytest -q -m "not slow" -n auto

  # Real-time feeds, decode budgets, whole-transmission decodes, and the demodulator
  # throughput budget. Slow on purpose: a Scottie S2 is 71 seconds of audio, so
  # decoding one at wall-clock rate takes 71 seconds. Nothing to optimise; they just
  # should not block the fast signal.
  #
  # Runs SERIALLY. TestThroughput asserts the demodulator beats real time, which is a
  # CPU measurement -- under -n auto on a four-core runner it failed at 0.109s against
  # a 0.100s budget purely from contention. Sharing cores makes a throughput assertion
  # meaningless, so this job does not.
  slow:
    runs-on: ubuntu-latest
    # Serial by design. Measured 6m03s when this job was written, 14m45s on
    # 2026-09-11 once the 48 kHz VIS sweep (#137) joined it -- five minutes of
    # headroom against the old 20, which a slower runner would have eaten.
    # 30 still means wedged rather than slow.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: sstv_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sounddevice needs PortAudio, opencv-python needs libGL.
      #
      # Not installed at all, deliberately.
      #
      # tests/conftest.py mocks sounddevice before any SSTeVe module is
      # imported -- its own comment says "This prevents PortAudio library
      # errors in CI environments" -- and opencv is used only for imwrite and
      # cvtColor, so no GUI path and no libGL. Verified locally that the
      # package imports and cv2.imwrite work with sounddevice mocked out.
      #
      # Keeping the step cost 192 seconds on 2026-08-19 while the Azure mirror
      # was down (`Ign:` on all four noble repos, falling back to the global
      # archive), for packages nothing in the suite touches. If a future test
      # genuinely needs real audio hardware, add the install back to that job
      # alone rather than to every run.

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run slow tests
        run: uv run pytest -q -m slow

  # The desktop shell. A new job rather than a rename: branch protection requires
  # `fast` and `slow` by name, and renaming a required job blocks every merge until
  # the required-checks list is updated (2026-08-19). This one is not required, so a
  # red build here is visible without wedging the repository.
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sstv_desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sstv_desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Lint, types, tests and the production build -- the same four a
      # developer runs (#144). The Rust side is still missing: it needs a
      # GTK/webkit toolchain on Linux that takes longer to install than this
      # job takes to run. Add a `tauri build` job when that is worth paying
      # for.
      - name: Lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
