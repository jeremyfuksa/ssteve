name: CI

on:
  push:
    branches: [ third-shot, main, master ]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sstv_core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (PortAudio, OpenGL for OpenCV)
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 libgl1

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check src/

      - name: Type check
        run: uv run mypy src/

      - name: Run tests
        run: uv run pytest -q
