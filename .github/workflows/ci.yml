name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install and build web (Vite)
        working-directory: sstv-station
        run: |
          npm ci
          npm run build --if-present

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust fmt/clippy/build (Tauri backend)
        working-directory: sstv-station/src-tauri
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets -- -D warnings
          cargo build --locked

      - name: Rust tests
        working-directory: sstv-station/src-tauri
        run: |
          cargo test --locked --all

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps (optional)
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r core/python/requirements.txt
          python -c "import sys;print(sys.version)"

      - name: Python smoke tests (guarded)
        env:
          RUN_ENGINE_TESTS: ${{ secrets.RUN_ENGINE_TESTS || '0' }}
        run: |
          source venv/bin/activate
          python -m pip install pytest
          pytest -q core/python/tests || true
